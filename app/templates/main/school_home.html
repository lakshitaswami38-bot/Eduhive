{% extends "base.html" %}
{% block title %}{{ school.name }} - EduHive{% endblock %}
{% block content %}
<div class="container py-5">
    <h1>Welcome, {{ school.name }}</h1>
    <p class="text-muted">Your school is verified. Keep your profile up to date so families can find you.</p>
    <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-eh" href="{{ url_for('schools.profile') }}">Edit school profile</a>
        <a class="btn btn-eh-dark" href="{{ url_for('schools.public', school_id=school.id) }}">View public page</a>
        <a class="btn btn-eh-outline-dark" href="{{ url_for('schools.status') }}">Application details</a>
    </div>
</div>
{% endblock %}
